name: Go core migration

on:
  push:
    branches: [master, codex/go-core-migration]
  pull_request:
    paths:
      - 'go-core/**'
      - 'src/**'
      - 'public/**'
      - 'tests/go-core-admin.test.mjs'
      - 'config/**'
      - '.github/workflows/go-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parity-and-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Vet and race detection
        working-directory: go-core
        run: |
          mkdir -p ../data/go-migration
          go vet ./...
          go test -race -timeout 90s -json ./... > ../data/go-migration/go-test.jsonl
      - name: Build laboratory binary
        working-directory: go-core
        run: go build -trimpath -o ../data/go-migration/amr-core ./cmd/amr-core
      - name: Compare with Node reference
        run: node go-core/compat/verify.mjs --binary data/go-migration/amr-core
      - name: Compare native feature defaults and boundary types
        run: node go-core/compat/verify-features.mjs --binary data/go-migration/amr-core
      - name: Compare native request semantics
        run: node go-core/compat/verify-analysis.mjs --binary data/go-migration/amr-core
      - name: Compare semantic review contract
        run: node go-core/compat/verify-semantic.mjs --binary data/go-migration/amr-core
      - name: Verify real Go process with local mock upstream
        run: node go-core/compat/demo.mjs --binary data/go-migration/amr-core
      - name: Verify native semantic review and tenant scopes
        run: node go-core/compat/demo-semantic.mjs --binary data/go-migration/amr-core
      - name: Verify durable runtime, retry and atomic hot reload
        run: node go-core/compat/demo-runtime.mjs --binary data/go-migration/amr-core
      - name: Verify native runtime without an adapter process
        run: node go-core/compat/demo-runtime.mjs --binary data/go-migration/amr-core --snapshot
      - name: Verify native feature reassessment and tenant scopes without an adapter
        run: node go-core/compat/demo-semantic.mjs --binary data/go-migration/amr-core --snapshot
      - name: Verify opt-in management bridge
        run: node --test tests/go-core-admin.test.mjs tests/go-core-publication.test.mjs
      - name: Verify offline rollback accounting continuity
        run: node go-core/compat/demo-rollback.mjs --binary data/go-migration/amr-core
      - name: Verify Node HTTP edge and Go event contracts
        run: node --test tests/go-core-edge.test.mjs tests/go-config-publication.test.mjs tests/go-core-observation.test.mjs tests/go-core-runtime-admin.test.mjs tests/go-import-publication.test.mjs
      - name: Verify production edge integration with mock providers
        run: |
          node go-core/compat/demo-edge.mjs --binary data/go-migration/amr-core --out data/go-migration/edge-default.json
          node go-core/compat/demo-edge.mjs --binary data/go-migration/amr-core --semantic shadow --out data/go-migration/edge-shadow.json
          node go-core/compat/demo-edge.mjs --binary data/go-migration/amr-core --semantic active --out data/go-migration/edge-active.json
      - name: Verify native public front, Node outcomes and privacy
        run: |
          node go-core/compat/demo-edge.mjs --binary data/go-migration/amr-core --native-front --out data/go-migration/native-front-default.json
          node go-core/compat/demo-edge.mjs --binary data/go-migration/amr-core --native-front --semantic shadow --out data/go-migration/native-front-shadow.json
          node go-core/compat/demo-edge.mjs --binary data/go-migration/amr-core --native-front --semantic active --out data/go-migration/native-front-active.json
          node go-core/compat/demo-edge.mjs --binary data/go-migration/amr-core --native-front --node-cost-observation --out data/go-migration/native-node-cost-default.json
          node go-core/compat/demo-edge.mjs --binary data/go-migration/amr-core --native-front --node-cost-observation --semantic shadow --out data/go-migration/native-node-cost-shadow.json
          node go-core/compat/demo-edge.mjs --binary data/go-migration/amr-core --native-front --node-cost-observation --semantic active --out data/go-migration/native-node-cost-active.json
          node go-core/compat/demo-edge.mjs --binary data/go-migration/amr-core --native-front --node-cost-observation --semantic shadow --go-shutdown --out data/go-migration/native-go-shutdown.json
      - name: Verify persistent result delivery across receiver and sender restart
        run: node go-core/compat/demo-edge.mjs --binary data/go-migration/amr-core --native-front --node-cost-observation --delivery-restart --out data/go-migration/native-delivery-restart.json
      - name: Confirm the shutdown regression reproduces on the previous candidate
        run: |
          git fetch --no-tags --depth=1 origin tag v0.14.7
          baseline="$RUNNER_TEMP/amr-before-shadow-drain"
          mkdir -p "$baseline"
          git archive v0.14.7 go-core | tar -x -C "$baseline"
          (cd "$baseline/go-core" && go build -trimpath -o "$GITHUB_WORKSPACE/data/go-migration/amr-before-shadow-drain" ./cmd/amr-core)
          set +e
          node go-core/compat/demo-edge.mjs --binary data/go-migration/amr-before-shadow-drain --native-front --node-cost-observation --semantic shadow --go-shutdown > data/go-migration/shutdown-before.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -q 'Go exited with an unfinished shadow review' data/go-migration/shutdown-before.log
      - name: Exercise same-host gateway comparison (smoke only, no capacity claim)
        run: node go-core/compat/compare-gateways.mjs --binary data/go-migration/amr-core --seconds 1 --rounds 1 --concurrency 1,8 --chunk-ms 40 --out data/go-migration/gateway-smoke.json
        # Includes real cookie-authenticated Node config save -> snapshot -> Go.
      - name: Verify management snapshot publication end to end
        run: node go-core/compat/compare-gateways.mjs --binary data/go-migration/amr-core --snapshot --seconds 1 --rounds 1 --concurrency 1 --chunk-ms 40 --out data/go-migration/publication-management.json
      - name: Archive verification evidence
        if: always() && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_LABEL: go-core-migration-evidence
          EVIDENCE_JOB_STATUS: ${{ job.status }}
          EVIDENCE_PATHS: |
            data/go-migration/*.json
            data/go-migration/*.jsonl
            data/go-migration/*.log
        run: node scripts/archive-ci-evidence.mjs
      - name: Record PR evidence scope
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        run: echo "PR verification uses workflow logs; raw evidence is not published to Releases from PR jobs." >> "$GITHUB_STEP_SUMMARY"

  node-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Prepare classifier and browser tests
        run: |
          python3 -m venv "$RUNNER_TEMP/amr-tests"
          "$RUNNER_TEMP/amr-tests/bin/python" -m pip install -r requirements-classifier.lock playwright==1.61.0
          "$RUNNER_TEMP/amr-tests/bin/python" -m playwright install --with-deps chromium
          echo "$RUNNER_TEMP/amr-tests/bin" >> "$GITHUB_PATH"
          echo "CLASSIFIER_PYTHON=$RUNNER_TEMP/amr-tests/bin/python" >> "$GITHUB_ENV"
      - name: Run Node and browser regression without skipped tests
        env:
          AMR_TEST_STRICT_SKIP: '1'
        run: npm test
