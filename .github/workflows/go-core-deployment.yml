name: Go core isolated deployment
on:
  push:
    branches: [master, codex/go-core-migration]
    paths: ['go-core/**', 'src/**', 'config/**', 'Dockerfile*', 'docker-compose.prod.yml', '.github/workflows/go-core-deployment.yml']
  pull_request:
    paths: ['go-core/**', 'src/**', 'config/**', 'Dockerfile*', 'docker-compose.prod.yml', '.github/workflows/go-core-deployment.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Prepare disposable local fixtures
        run: |
          AMR_VERIFY_COMPOSE=1 python3 go-core/deployment/test_native_compose.py
          python3 go-core/deployment/test_prepare_native.py
          node go-core/deployment/prepare.mjs
          sudo chown -R 65532:65532 data/go-deployment/config data/go-deployment/ledger
      - name: Build and test isolated containers
        run: bash go-core/deployment/smoke.sh
      - name: Exercise native Compose cutover and rollback with synthetic services
        # Some hosted sudo policies ignore -E. Pass only the two identity values
        # required by the disposable-runner guard; keep the guard unchanged.
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_SHA="$GITHUB_SHA" python3 go-core/deployment/native_smoke.py
      - name: Capture container state and logs
        if: always()
        run: |
          mkdir -p data/go-deployment/evidence
          docker compose -f go-core/compose.lab.yml ps -a > data/go-deployment/evidence/containers.txt
          docker compose -f go-core/compose.lab.yml logs --no-color > data/go-deployment/evidence/containers.log
          docker compose -f go-core/compose.lab.yml down
      - name: Archive verification evidence
        if: always() && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_LABEL: go-core-deployment-evidence
          EVIDENCE_JOB_STATUS: ${{ job.status }}
          EVIDENCE_PATHS: |
            data/go-deployment/evidence/
            data/go-native-deployment/
        run: node scripts/archive-ci-evidence.mjs
      - name: Record PR evidence scope
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        run: echo "PR verification uses workflow logs; raw evidence is not published to Releases from PR jobs." >> "$GITHUB_STEP_SUMMARY"
