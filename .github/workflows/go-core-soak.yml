name: Go core stability soak
on:
  push:
    branches: [codex/go-core-migration]
    paths: ['go-core/**', 'src/go-runtime/**', '.github/workflows/go-core-soak.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Prepare isolated fixtures
        run: |
          node go-core/deployment/prepare-soak.mjs
          sudo chown -R 65532:65532 data/go-soak/config data/go-soak/ledger
          sudo chgrp 65532 data/go-soak/evidence
          chmod 2770 data/go-soak/evidence
      - name: Exercise soak contract before long run
        env:
          SOAK_SECONDS: '60'
          SOAK_RPS: '25'
          SOAK_LONG_SECONDS: '10'
          SOAK_RELOAD_SECONDS: '5'
        run: bash go-core/deployment/soak.sh
      - name: Capture state
        if: always()
        run: |
          docker compose -f go-core/compose.soak.yml logs --no-color > data/go-soak/evidence/containers.log
          docker compose -f go-core/compose.soak.yml down
      - name: Archive verification evidence
        if: always() && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_LABEL: go-core-soak-smoke
          EVIDENCE_JOB_STATUS: ${{ job.status }}
          EVIDENCE_PATHS: |
            data/go-soak/evidence/
        run: node scripts/archive-ci-evidence.mjs
      - name: Record PR evidence scope
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        run: echo "PR verification uses workflow logs; raw evidence is not published to Releases from PR jobs." >> "$GITHUB_STEP_SUMMARY"

  one-hour:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[soak-hour]')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - name: Prepare isolated fixtures
        run: |
          node go-core/deployment/prepare-soak.mjs
          sudo chown -R 65532:65532 data/go-soak/config data/go-soak/ledger
          sudo chgrp 65532 data/go-soak/evidence
          chmod 2770 data/go-soak/evidence
      - name: One hour at fixed 100 RPS
        env:
          SOAK_SECONDS: '3600'
          SOAK_RPS: '100'
          SOAK_LONG_SECONDS: '300'
          SOAK_RELOAD_SECONDS: '60'
        run: bash go-core/deployment/soak.sh
      - name: Capture state
        if: always()
        run: |
          docker compose -f go-core/compose.soak.yml logs --no-color > data/go-soak/evidence/containers.log
          docker compose -f go-core/compose.soak.yml down
      - name: Archive verification evidence
        if: always() && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_LABEL: go-core-soak-hour
          EVIDENCE_JOB_STATUS: ${{ job.status }}
          EVIDENCE_PATHS: |
            data/go-soak/evidence/
        run: node scripts/archive-ci-evidence.mjs
      - name: Record PR evidence scope
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        run: echo "PR verification uses workflow logs; raw evidence is not published to Releases from PR jobs." >> "$GITHUB_STEP_SUMMARY"
