name: Go core capacity experiment

on:
  push:
    branches: [codex/go-core-migration]
    paths:
      - 'go-core/compat/capacity-*.mjs'
      - 'go-core/compat/compare-capacity.mjs'
      - '.github/workflows/go-core-capacity.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: Local mock workload size (never production)
        type: choice
        options: [smoke, standard, diagnostic, optimization, tail-optimization, runtime-profile, runtime-optimization, cold-optimization]
        default: smoke

permissions:
  contents: read

jobs:
  equal-quota:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Build current Linux candidate
        working-directory: go-core
        run: |
          mkdir -p ../data/go-migration
          CGO_ENABLED=0 go build -trimpath -o ../data/go-migration/amr-core-linux ./cmd/amr-core
      - name: Same quota, mixed open-loop load and long SSE
        env:
          PROFILE: ${{ inputs.profile || 'smoke' }}
        run: |
          if [ "$PROFILE" = "standard" ]; then
            node go-core/compat/compare-capacity.mjs --binary data/go-migration/amr-core-linux --seconds 10 --rounds 3 --rates 50,150,300 --stream-seconds 60 --streams 32 --cpus 1 --memory-mib 512 --out data/go-migration/capacity-standard.json
          elif [ "$PROFILE" = "optimization" ] || [ "$PROFILE" = "tail-optimization" ]; then
            baseline=f30e8d7eddd290732b66210c9b6fbf8123f1a192
            if [ "$PROFILE" = "tail-optimization" ]; then baseline=cd02f356d165c5bf1ddd73048c52bc4167fb73d8; fi
            git fetch --no-tags --depth=1 origin "$baseline"
            git worktree add --detach "$RUNNER_TEMP/amr-capacity-baseline" "$baseline"
            (cd "$RUNNER_TEMP/amr-capacity-baseline/go-core" && CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/data/go-migration/amr-core-before" ./cmd/amr-core)
            (cd "$RUNNER_TEMP/amr-capacity-baseline/go-core" && go test ./internal/analysis -run '^$' -bench BenchmarkCapacityAnalysis -benchtime 2s -count 2) > data/go-migration/before-benchmark.log
            (cd go-core && go test ./internal/analysis -run '^$' -bench BenchmarkCapacityAnalysis -benchtime 2s -count 2) > data/go-migration/after-benchmark.log
            BASELINE="$baseline" node -e 'require("node:fs").writeFileSync("data/go-migration/capacity-pair-source.json", JSON.stringify({before:process.env.BASELINE,after:process.env.GITHUB_SHA,order:["before","after"],sameRunner:true}))'
            node go-core/compat/compare-capacity.mjs --go-procs 1 --binary data/go-migration/amr-core-before --seconds 10 --rounds 3 --rates 150,300 --stream-seconds 60 --streams 32 --cpus 1 --memory-mib 512 --out data/go-migration/capacity-before.json
            node go-core/compat/compare-capacity.mjs --go-procs 1 --binary data/go-migration/amr-core-linux --seconds 10 --rounds 3 --rates 150,300 --stream-seconds 60 --streams 32 --cpus 1 --memory-mib 512 --out data/go-migration/capacity-after.json
          elif [ "$PROFILE" = "cold-optimization" ]; then
            baseline=5a97c1de583757a61d48453f34ab869e722eba57
            git fetch --no-tags --depth=1 origin "$baseline"
            git worktree add --detach "$RUNNER_TEMP/amr-cold-baseline" "$baseline"
            (cd "$RUNNER_TEMP/amr-cold-baseline/go-core" && CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/data/go-migration/amr-core-before" ./cmd/amr-core)
            BASELINE="$baseline" node -e 'require("node:fs").writeFileSync("data/go-migration/capacity-cold-source.json", JSON.stringify({before:process.env.BASELINE,after:process.env.GITHUB_SHA,goProcs:"auto",order:["before-1","after-1","after-2","before-2"],freshProcessAndLedgerEach:true}))'
            for phase in before-1 after-1 after-2 before-2; do
              binary=data/go-migration/amr-core-linux
              if [[ "$phase" == before-* ]]; then binary=data/go-migration/amr-core-before; fi
              node go-core/compat/compare-capacity.mjs --go-procs auto --binary "$binary" --seconds 10 --rounds 3 --rates 300 --stream-seconds 2 --streams 2 --cpus 1 --memory-mib 512 --out "data/go-migration/capacity-cold-$phase.json"
            done
            node go-core/compat/compare-capacity.mjs --go-procs auto --binary data/go-migration/amr-core-linux --seconds 10 --rounds 3 --rates 150,300 --stream-seconds 60 --streams 32 --cpus 1 --memory-mib 512 --out data/go-migration/capacity-cold-warm-check.json
            node go-core/compat/compare-capacity.mjs --profile --go-procs auto --binary data/go-migration/amr-core-linux --seconds 10 --rounds 3 --rates 300 --stream-seconds 2 --streams 2 --cpus 1 --memory-mib 512 --out data/go-migration/capacity-profile-cold-after.json
            go tool trace -d=parsed data/go-migration/capacity-profile-cold-after.json.profiles/runtime.trace | node go-core/compat/summarize-trace.mjs data/go-migration/capacity-profile-cold-after-regions.json
          elif [ "$PROFILE" = "runtime-optimization" ]; then
            node -e 'require("node:fs").writeFileSync("data/go-migration/capacity-runtime-source.json", JSON.stringify({kind:"scheduler-setting",commit:process.env.GITHUB_SHA,before:"1",after:"auto",sameBinary:true,order:["before","after","cold-auto"]}))'
            node go-core/compat/compare-capacity.mjs --go-procs 1 --binary data/go-migration/amr-core-linux --seconds 10 --rounds 3 --rates 150,300 --stream-seconds 60 --streams 32 --cpus 1 --memory-mib 512 --out data/go-migration/capacity-runtime-before.json
            node go-core/compat/compare-capacity.mjs --go-procs auto --binary data/go-migration/amr-core-linux --seconds 10 --rounds 3 --rates 150,300 --stream-seconds 60 --streams 32 --cpus 1 --memory-mib 512 --out data/go-migration/capacity-runtime-after.json
            node go-core/compat/compare-capacity.mjs --go-procs auto --binary data/go-migration/amr-core-linux --seconds 10 --rounds 3 --rates 300 --stream-seconds 2 --streams 2 --cpus 1 --memory-mib 512 --out data/go-migration/capacity-runtime-cold.json
          elif [ "$PROFILE" = "runtime-profile" ]; then
            for procs in 1 auto; do
              result="data/go-migration/capacity-profile-$procs"
              node go-core/compat/compare-capacity.mjs --profile --go-procs "$procs" --binary data/go-migration/amr-core-linux --seconds 10 --rounds 3 --rates 300 --stream-seconds 2 --streams 2 --cpus 1 --memory-mib 512 --out "$result.json"
              for kind in cpu block mutex; do
                go tool pprof -top -nodecount=40 data/go-migration/amr-core-linux "$result.json.profiles/$kind.pprof" > "$result-$kind.txt"
              done
              for kind in net sync syscall sched; do
                go tool trace -pprof="$kind" "$result.json.profiles/runtime.trace" > "$result-$kind.pprof"
                go tool pprof -top -nodecount=30 "$result-$kind.pprof" > "$result-$kind.txt"
              done
              go tool trace -d=parsed "$result.json.profiles/runtime.trace" | node go-core/compat/summarize-trace.mjs "$result-regions.json"
            done
          elif [ "$PROFILE" = "diagnostic" ]; then
            (cd go-core && go test ./internal/analysis -run '^$' -bench BenchmarkCapacityAnalysis -benchtime 3s -count 2 -cpuprofile ../data/go-migration/analysis.cpu.pprof -o ../data/go-migration/analysis.test) > data/go-migration/analysis-benchmark.log
            go tool pprof -top -nodecount=30 data/go-migration/analysis.test data/go-migration/analysis.cpu.pprof > data/go-migration/analysis-cpu-top.txt
            go tool pprof -list 'Analyzer.*Analyze' data/go-migration/analysis.test data/go-migration/analysis.cpu.pprof > data/go-migration/analysis-cpu-lines.txt
            (cd go-core && go test ./internal/gateway -run '^$' -bench BenchmarkCapacityPersistence -benchtime 3s -count 2) > data/go-migration/persistence-benchmark.log
            for shapes in short,history,tools,image short history; do
              node go-core/compat/compare-capacity.mjs --binary data/go-migration/amr-core-linux --seconds 10 --rounds 2 --rates 150,300 --stream-seconds 2 --streams 2 --cpus 1 --memory-mib 512 --shapes "$shapes" --out "data/go-migration/capacity-diagnostic-${shapes//,/-}.json"
            done
          else
            node go-core/compat/compare-capacity.mjs --binary data/go-migration/amr-core-linux --seconds 1 --rounds 1 --rates 8 --stream-seconds 2 --streams 2 --cpus 1 --memory-mib 512 --out data/go-migration/capacity-smoke.json
          fi
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: go-core-capacity-evidence
          path: |
            data/go-migration/capacity-*.json
            data/go-migration/analysis*.pprof
            data/go-migration/analysis*.txt
            data/go-migration/*-benchmark.log
            data/go-migration/capacity-profile*
          if-no-files-found: error
          retention-days: 14
