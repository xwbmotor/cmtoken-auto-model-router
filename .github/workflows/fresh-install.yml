name: Fresh installation verification
on:
  push:
    branches: [master]
    paths: ['deployment/**', '.github/workflows/fresh-install.yml']
  workflow_dispatch:
permissions:
  contents: write  # 上传安装包到 Release assets
  actions: read
jobs:
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Validate installation inputs and protected preparation
        run: python3 -m unittest discover -s deployment -p 'test_*.py' -v
      - name: Download the previously verified application images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json;print(json.load(open('deployment/release.json'))['version'])")
          source_run=$(python3 -c "import json;print(json.load(open('deployment/release.json')).get('sourceRunId',34614987601))")
          if gh release download "v$version" --pattern "release-images-v$version.zip" --dir data/fresh-release; then
            python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          release = json.loads(pathlib.Path('deployment/release.json').read_text())
          p = pathlib.Path('data/fresh-release/release-images-v'+release['version']+'.zip')
          expected = release['sourceArchiveSha256']
          with p.open('rb') as f:
              assert hashlib.file_digest(f, 'sha256').hexdigest() == expected
          with zipfile.ZipFile(p) as z:
              z.extractall('data/fresh-bundle/images')
          PY
          else
            # 镜像 tar.gz 已由 release-validation workflow 挂到 Release assets(cmt-* 前缀,避开 amr-offline 安装包)
            gh release download "v$version" --dir data/fresh-bundle/images --pattern "cmt-*.tar.gz" --clobber
            python3 - <<'PY'
          import hashlib, json, pathlib
          release = json.loads(pathlib.Path('deployment/release.json').read_text())
          for image in release['images'].values():
              p = pathlib.Path('data/fresh-bundle/images')/image['archive']
              with p.open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == image['sha256'], image['archive']
          PY
          fi
      - name: Install with no host Python or Node, then verify JSON, SSE and restart
        run: sudo -E python3 deployment/offline/ci_shell.py
      - name: Build the standard installation archive
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {validateConfig} from './src/config.mjs'; validateConfig(JSON.parse(readFileSync('config/router.json','utf8')));"
          version=$(python3 -c "import json;print(json.load(open('deployment/release.json'))['version'])")
          python3 deployment/offline/build_bundle.py --images data/fresh-bundle/images --out "data/distribution/amr-offline-$version"
      - name: Publish the verified installation archive to the release
        # 安装包挂到 Release(不计入 Actions 存储额度),替代原 amr-installation artifact;
        # 部署侧可直接从 Release 下载
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json;print(json.load(open('deployment/release.json'))['version'])")
          if ! gh release view "v$version" >/dev/null 2>&1; then
            echo "WARN: release v$version not found, skip publishing (verification still passed)"
            exit 0
          fi
          # 已存在的资产不覆盖(--clobber 仅对本次新建的文件),保持文档记录的 SHA256 有效
          existing=$(gh release view "v$version" --json assets -q '.assets[].name')
          shopt -s nullglob
          for f in data/distribution/*.tar.gz data/distribution/*.tar.gz.sha256; do
            base=$(basename "$f")
            if echo "$existing" | grep -qx "$base"; then
              echo "skip existing asset: $base"
            else
              gh release upload "v$version" "$f"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fresh-install-evidence
          path: data/fresh-install-evidence/
          retention-days: 14
