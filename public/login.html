<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Auto Model Router 管理端</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* 登录页独立布局：居中卡片，复用管理台配色变量 */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg, #0d1117); padding: 24px; }
  .login-card { width: 100%; max-width: 380px; background: var(--panel, #161b22); border: 1px solid var(--border, #30363d); border-radius: 12px; padding: 32px 28px; }
  .login-card .eyebrow { margin: 0 0 6px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted, #8b949e); }
  .login-card h1 { margin: 0 0 4px; font-size: 20px; color: var(--text, #e6edf3); }
  .login-card .sub { margin: 0 0 24px; font-size: 13px; color: var(--muted, #8b949e); }
  .login-card label { display: block; font-size: 13px; color: var(--text, #e6edf3); margin-bottom: 8px; }
  .login-card input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border, #30363d); background: var(--bg, #0d1117); color: var(--text, #e6edf3); font-size: 14px; margin-bottom: 16px; }
  .login-card input:focus { outline: 2px solid var(--accent, #2f81f7); outline-offset: -1px; }
  .login-card button { width: 100%; padding: 10px; font-size: 14px; border-radius: 8px; border: none; background: var(--accent, #2f81f7); color: #fff; cursor: pointer; font-weight: 600; }
  .login-card button:disabled { opacity: .6; cursor: wait; }
  .login-err { min-height: 20px; font-size: 13px; color: #f85149; margin: 10px 0 0; }
  .login-note { margin: 18px 0 0; font-size: 12px; color: var(--muted, #8b949e); line-height: 1.6; }
</style>
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="loginForm" autocomplete="off">
    <p class="eyebrow">模型路由 · 运行管理</p>
    <h1>Auto Model Router</h1>
    <p class="sub">管理端需要登录后访问</p>
    <label for="adminToken">Admin Token</label>
    <input id="adminToken" type="password" placeholder="填写 ADMIN_TOKEN" required autofocus>
    <button id="loginBtn" type="submit">登 录</button>
    <p class="login-err" id="loginErr"></p>
    <p class="login-note">会话有效期：空闲 2 小时 / 最长 12 小时，到期自动重新登录。<br>脚本调用可继续使用 <code>Authorization: Bearer &lt;ADMIN_TOKEN&gt;</code>，不受影响。</p>
  </form>
</div>
<script>
(function () {
  var form = document.getElementById('loginForm');
  var btn = document.getElementById('loginBtn');
  var err = document.getElementById('loginErr');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var token = document.getElementById('adminToken').value;
    btn.disabled = true; err.textContent = '';
    fetch('/admin/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token: token }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status === 429 ? '尝试过于频繁，请稍后再试' : 'Admin Token 无效'); return r.json(); })
      .then(function () { window.location.href = '/'; })
      .catch(function (e) { err.textContent = e.message || '登录失败'; btn.disabled = false; });
  });
})();
</script>
</body>
</html>
