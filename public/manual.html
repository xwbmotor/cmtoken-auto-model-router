<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>使用手册 · Auto Model Router</title>
<style>
  :root { --bg:#fafafa; --panel:#fff; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --brand:#3538cd; --brand-soft:#eef2ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.8 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  /* ── 顶栏 ── */
  header.top { position:sticky; top:0; z-index:9; background:rgba(250,250,250,.96); border-bottom:1px solid var(--border); backdrop-filter:blur(6px); }
  header.top .inner { max-width:1180px; margin:0 auto; padding:10px 24px; display:flex; align-items:center; gap:14px; }
  header.top h1 { font-size:15px; margin:0; }
  header.top .ver { color:var(--muted); font-size:12px; }
  header.top .back { color:var(--brand); text-decoration:none; font-size:13px; margin-left:auto; }
  /* ── 布局：左 TOC + 右正文 ── */
  .layout { max-width:1180px; margin:0 auto; padding:24px 24px 80px; display:flex; gap:36px; align-items:flex-start; }
  nav.toc { width:210px; flex:none; position:sticky; top:64px; max-height:calc(100vh - 88px); overflow:auto; padding:4px 0; }
  nav.toc .toc-title { font-size:11px; font-weight:600; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; padding:6px 10px; }
  nav.toc a { display:block; padding:5px 10px 5px 16px; color:#4b5563; text-decoration:none; font-size:13px; border-left:2px solid transparent; border-radius:0 6px 6px 0; line-height:1.5; }
  nav.toc a:hover { color:var(--brand); background:var(--brand-soft); }
  nav.toc a.active { color:var(--brand); border-left-color:var(--brand); font-weight:600; background:var(--brand-soft); }
  main.doc { flex:1; min-width:0; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:36px 44px; box-shadow:0 1px 3px rgba(16,24,40,.05); }
  /* ── 正文排版 ── */
  main.doc > h1 { font-size:24px; margin:0 0 6px; }
  main.doc > p:first-of-type { color:var(--muted); font-size:14.5px; margin-top:0; }
  h2 { font-size:19px; margin:34px 0 10px; padding-bottom:8px; border-bottom:1px solid var(--border); scroll-margin-top:76px; }
  h3 { font-size:15.5px; margin:22px 0 8px; scroll-margin-top:76px; }
  h2, h3 { scroll-margin-top:80px; }
  code { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-size:.9em; font-family:ui-monospace,Consolas,monospace; }
  pre { background:#0f172a; color:#e2e8f0; border-radius:10px; padding:16px 18px; overflow:auto; margin:12px 0; position:relative; }
  pre code { background:none; border:none; color:inherit; padding:0; font-size:12.5px; line-height:1.7; }
  /* 代码块右上角复制按钮：hover/触摸时浮现，复制成功后短暂变绿打勾 */
  pre .copy-btn { position:absolute; top:8px; right:8px; padding:3px 10px; border:1px solid #334155; border-radius:6px; background:rgba(15,23,42,.85); color:#cbd5e1; font-size:12px; line-height:1.5; cursor:pointer; opacity:0; transition:opacity .15s ease; }
  pre:hover .copy-btn, pre .copy-btn:focus-visible, pre .copy-btn.copied { opacity:1; }
  pre .copy-btn:hover { border-color:#64748b; color:#f1f5f9; }
  pre .copy-btn.copied { border-color:#22c55e; color:#4ade80; }
  table { border-collapse:collapse; width:100%; margin:14px 0; font-size:13.5px; }
  th,td { border:1px solid var(--border); padding:8px 12px; text-align:left; vertical-align:top; }
  th { background:#f8fafc; font-weight:600; }
  tr:nth-child(even) td { background:#fcfcfd; }
  blockquote { margin:14px 0; padding:10px 16px; border-left:3px solid var(--brand); background:var(--brand-soft); border-radius:0 8px 8px 0; color:#374151; }
  a { color:var(--brand); }
  ul,ol { padding-left:22px; }
  li { margin:4px 0; }
  /* ── embed 模式（管理页 tab iframe 内）── */
  body.embed header.top { display:none; }
  body.embed .layout { max-width:none; padding:0 4px 40px; gap:28px; }
  body.embed nav.toc { top:8px; max-height:calc(100vh - 24px); }
  body.embed main.doc { border:none; box-shadow:none; border-radius:0; padding:24px 30px; }
  /* 窄屏收起 TOC */
  @media (max-width: 900px) { nav.toc { display:none; } .layout { padding:16px; } main.doc { padding:22px 20px; } }
</style></head>
<body>
<header class="top"><div class="inner"><h1>使用手册</h1><span class="ver" id="ver"></span><a class="back" href="/">← 返回管理页</a></div></header>
<div class="layout"><nav class="toc" id="toc"></nav><main class="doc" id="doc">__MANUAL_BODY__</main></div>
<script>
// 服务端已把整篇 markdown 渲染为 HTML 注入 __MANUAL_HTML__（含 esc 转义）；
// 本脚本只负责：还原正文 + 生成左侧目录 + 滚动高亮。即使 JS 失败，正文也已可见。
(function () {
  // 正文已由服务端预渲染到 <main id="doc">；脚本只生成左侧目录与滚动高亮，失败也不影响阅读
  var ver = "__MANUAL_VERSION__";
  document.getElementById('ver').textContent = ver && ver.indexOf('__') !== 0 ? ('v' + ver) : '';
  if (location.search.indexOf('embed=1') !== -1) document.body.className = 'embed';
  // 目录：抓 <main> 内的 h2/h3（服务端已注入稳定 id；此兜底只为旧缓存）
  var heads = Array.prototype.slice.call(document.querySelectorAll('main.doc h2, main.doc h3'));
  var toc = document.getElementById('toc');
  var frag = document.createDocumentFragment();
  var title = document.createElement('div');
  title.className = 'toc-title'; title.textContent = '目录';
  frag.appendChild(title);
  heads.forEach(function (h, i) {
    if (!h.id) h.id = 'sec-' + i;
    var a = document.createElement('a');
    a.href = '#' + h.id; a.textContent = h.textContent;
    if (h.tagName === 'H3') a.style.paddingLeft = '30px';
    frag.appendChild(a);
  });
  toc.appendChild(frag);
  // 代码块复制按钮（navigator.clipboard 不可用时退回 execCommand）
  Array.prototype.forEach.call(document.querySelectorAll('pre'), function (pre) {
    var btn = document.createElement('button');
    btn.className = 'copy-btn'; btn.type = 'button'; btn.textContent = '复制';
    btn.addEventListener('click', function () {
      var text = pre.querySelector('code') ? pre.querySelector('code').textContent : pre.textContent;
      function done(ok) {
        btn.textContent = ok ? '已复制 ✓' : '复制失败';
        btn.classList.toggle('copied', ok);
        setTimeout(function () { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1600);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(legacyCopy(text)); });
      } else { done(legacyCopy(text)); }
    });
    pre.appendChild(btn);
  });
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); return ok;
  }
  // 滚动高亮当前节
  var links = Array.prototype.slice.call(toc.querySelectorAll('a'));
  function onScroll() {
    var cur = null;
    heads.forEach(function (h) { if (h.getBoundingClientRect().top < 100) cur = h.id; });
    links.forEach(function (a) { a.className = a.getAttribute('href') === '#' + cur ? 'active' : ''; });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
</body></html>
