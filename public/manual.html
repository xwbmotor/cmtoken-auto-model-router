<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>使用手册 · Auto Model Router</title>
<style>
  :root { --bg:#fafafa; --panel:#fff; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --brand:#3538cd; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.75 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 24px 80px; }
  header.top { position:sticky; top:0; z-index:5; background:rgba(250,250,250,.95); border-bottom:1px solid var(--border); backdrop-filter:blur(6px); }
  header.top .inner { max-width:920px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; gap:14px; }
  header.top h1 { font-size:16px; margin:0; }
  header.top .back { color:var(--brand); text-decoration:none; font-size:13px; margin-left:auto; }
  .doc { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:32px 36px; box-shadow:0 1px 3px rgba(16,24,40,.05); }
  /* 手册正文由 JS 把转义后的 markdown 文本解析成 HTML（零依赖轻量解析：标题/表格/代码/列表/粗体/链接） */
  pre code { background:var(--bg); border:1px solid var(--border); border-radius:8px; display:block; padding:12px 14px; overflow:auto; font-size:12.5px; }
  code { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-size:.92em; }
  table { border-collapse:collapse; width:100%; margin:14px 0; font-size:13px; }
  th,td { border:1px solid var(--border); padding:7px 10px; text-align:left; }
  th { background:#f3f4f6; font-weight:600; }
  h2 { font-size:19px; margin:28px 0 10px; padding-top:16px; border-top:1px solid var(--border); }
  h3 { font-size:16px; margin:22px 0 8px; }
  blockquote { margin:12px 0; padding:10px 16px; border-left:3px solid var(--brand); background:#eef2ff66; border-radius:0 8px 8px 0; color:#374151; }
  a { color:var(--brand); }
</style></head>
<body>
<header class="top"><div class="inner"><h1>使用手册</h1><span style="color:var(--muted);font-size:12px">随服务发布 · docs/使用说明.md</span><a class="back" href="/">← 返回管理页</a></div></header>
<div class="wrap"><article class="doc" id="doc"><pre id="raw" style="display:none">__MANUAL_CONTENT__</pre><div id="out">正在加载…</div></article></div>
<script>
// 零依赖 markdown 渲染（覆盖手册用到的语法子集：标题/表格/代码块/行内代码/列表/粗体/链接/引用）
const esc = (s) => s; // 服务端已转义
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function render(md) {
  const lines = md.split('\n'); const out = []; let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.startsWith('```')) { // 代码块
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith('```')) { buf.push(lines[i]); i++; }
      i++; out.push('<pre><code>' + buf.join('\n') + '</code></pre>'); continue;
    }
    if (/^\|.*\|$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|$/.test(lines[i+1])) { // 表格
      const rows = []; let j = i + 2;
      while (j < lines.length && /^\|.*\|$/.test(lines[j])) { rows.push(lines[j]); j++; }
      const cells = (r) => r.split('|').slice(1, -1).map((c) => c.trim());
      out.push('<table><thead><tr>' + cells(line).map((c) => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'
        + rows.map((r) => '<tr>' + cells(r).map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
      i = j; continue;
    }
    if (/^#{1,3}\s/.test(line)) { const level = line.match(/^#+/)[0].length; out.push(`<h${level+1}>${inline(line.replace(/^#+\s*/, ''))}</h${level+1}>`); i++; continue; }
    if (/^&gt;\s?/.test(line)) { out.push('<blockquote>' + inline(line.replace(/^&gt;\s?/, '')) + '</blockquote>'); i++; continue; }
    if (/^[-*]\s/.test(line) || /^\d+\.\s/.test(line)) { // 列表
      const ordered = /^\d+\.\s/.test(line); const items = []; let j = i;
      while (j < lines.length && (/^[-*]\s/.test(lines[j]) || /^\d+\.\s/.test(lines[j]))) { items.push('<li>' + inline(lines[j].replace(/^([-*]|\d+\.)\s*/, '')) + '</li>'); j++; }
      out.push(`<${ordered ? 'ol' : 'ul'}>${items.join('')}</${ordered ? 'ol' : 'ul'}>`); i = j; continue;
    }
    if (!line.trim()) { i++; continue; }
    out.push('<p>' + inline(line) + '</p>'); i++;
  }
  return out.join('\n');
}
document.getElementById('out').innerHTML = render(document.getElementById('raw').textContent);
</script>
</body></html>
